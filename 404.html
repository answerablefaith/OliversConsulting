<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | Olivers Consulting</title>
  <meta name="description" content="The requested page could not be found. Return to Olivers Consulting or browse the latest automation articles.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root{color-scheme:light;--ink:#17130b;--green:#1e3b2f;--cream:#efe8dc;--gold:#b5791f;--line:#d6cdba}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif;display:grid;grid-template-rows:auto 1fr auto}
    header,main,footer{width:min(100% - 40px,1120px);margin-inline:auto}
    header{padding:28px 0;border-bottom:2px solid var(--ink)}
    .brand{color:var(--ink);font-weight:800;letter-spacing:.04em;text-decoration:none;text-transform:uppercase}
    main{display:grid;align-content:center;padding:72px 0}
    .eyebrow{color:var(--gold);font-size:.8rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{max-width:760px;margin:16px 0 20px;font-size:clamp(3rem,10vw,7rem);line-height:.88;text-transform:uppercase}
    p{max-width:620px;margin:0;font-size:1.1rem;line-height:1.6;color:#514a3d}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
    nav a{display:inline-flex;min-height:46px;align-items:center;border:2px solid var(--green);border-radius:8px;padding:10px 18px;color:var(--green);font-weight:800;text-decoration:none}
    nav a:first-child{background:var(--green);color:var(--cream)}
    nav a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    footer{padding:24px 0;border-top:1px solid var(--line);font-size:.9rem;color:#6b6354}
  </style>
</head>
<body>
  <header><a class="brand" href="/">Olivers Consulting</a></header>
  <main>
    <p class="eyebrow">Error 404</p>
    <h1>That page is not here.</h1>
    <p>The address may have changed, or the link may be incorrect. Return to the homepage or browse practical automation guidance in the articles section.</p>
    <nav aria-label="Page not found options">
      <a href="/">Return home</a>
      <a href="/articles/">Browse articles</a>
    </nav>
  </main>
  <footer>Olivers Consulting · Automation for UK ecommerce and wholesale</footer>
</body>
</html>
