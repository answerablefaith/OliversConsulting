name: Fix service price previews v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-service-price-previews-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make price previews visible and cache-bust assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/homepage.js')
          js = js_path.read_text(encoding='utf-8')

          # Restore the requested visible price-preview behaviour if an interim
          # whole-row implementation is present.
          if 'function initServicePricePreviews()' not in js:
              start = js.find('  function initServicePricingLinks() {')
              end = js.find('  function boot() {', start)
              if start == -1 or end == -1:
                  raise SystemExit('Could not find service pricing function to update')
              replacement = '''  function initServicePricePreviews() {
    const pricing = {
      'Quick win': { price: 'From £395', target: 'pricing-quick-win' },
      'Core automation': { price: 'From £1,495', target: 'pricing-core-automation' },
      'Multi-system build': { price: 'From £2,995', target: 'pricing-multi-system-build' },
    };

    all('.oc-pricing-band').forEach((card) => {
      const name = text(card.querySelector('.oc-pricing-band-name'));
      const option = pricing[name];
      if (!option) return;
      card.id = option.target;
      card.style.scrollMarginTop = '110px';
    });

    if (!document.getElementById('oc-service-price-preview-style')) {
      const style = document.createElement('style');
      style.id = 'oc-service-price-preview-style';
      style.textContent = `
        .oc-service-tier-wrap{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
        .oc-service-price-preview{display:inline-flex;align-items:center;gap:5px;color:#1e3b2f;font-family:'Saira Condensed',sans-serif;font-size:16px;font-weight:800;line-height:1;text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(30,59,47,.35);padding:4px 0 3px;transition:color .16s,border-color .16s,transform .16s}
        .oc-service-price-preview::after{content:'→';font-size:14px;line-height:1;transition:transform .16s}
        .oc-service-price-preview:hover,.oc-service-price-preview:focus-visible{color:#b5791f;border-color:#b5791f}
        .oc-service-price-preview:hover::after,.oc-service-price-preview:focus-visible::after{transform:translateX(2px)}
        .oc-service-price-preview:focus-visible{outline:2px solid #b5791f;outline-offset:4px;border-radius:2px}
        @media(max-width:900px){
          .oc-service-tier-wrap{justify-content:flex-start!important;gap:12px!important}
          .oc-service-price-preview{font-size:15px}
        }
      `;
      document.head.appendChild(style);
    }

    all('.oc-service-tier').forEach((tier) => {
      if (tier.dataset.ocPricePreviewBound) return;
      const name = text(tier);
      const option = pricing[name];
      if (!option) return;
      tier.dataset.ocPricePreviewBound = '1';

      const wrapper = tier.parentElement;
      if (!wrapper) return;
      wrapper.classList.add('oc-service-tier-wrap');

      const link = document.createElement('a');
      link.className = 'oc-service-price-preview';
      link.href = `#${option.target}`;
      link.textContent = option.price;
      link.setAttribute('aria-label', `${option.price} — view ${name} pricing`);
      wrapper.appendChild(link);
    });
  }

'''
              js = js[:start] + replacement + js[end:]
              js = js.replace('    initServicePricingLinks();', '    initServicePricePreviews();')
              js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/homepage-performance.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Visible service price previews v5 */'
          if marker not in css:
              css += '''\n\n/* Visible service price previews v5 */
.scp3{cursor:default!important}
.scp3 .oc-service-price-preview{
  position:static!important;inset:auto!important;z-index:auto!important;
  display:inline-flex!important;width:auto!important;height:auto!important;
  margin:0!important;padding:4px 0 3px!important;
  border:0!important;border-bottom:1px solid rgba(30,59,47,.35)!important;
  color:#1e3b2f!important;font-family:'Saira Condensed',sans-serif!important;
  font-size:16px!important;font-weight:800!important;line-height:1!important;
  text-decoration:none!important;white-space:nowrap!important
}
.scp3 .oc-service-price-preview::after{content:'→'!important;display:inline!important;font-size:14px!important;line-height:1!important;margin-left:5px!important}
@media(max-width:900px){.scp3 .oc-service-price-preview{font-size:15px!important;touch-action:manipulation}}
'''
              css_path.write_text(css, encoding='utf-8')

          version = '20260818-price-previews-v5'
          for name in ('index.html', 'scripts/optimize-homepage.mjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text, js_count = re.subn(r'/assets/homepage\.js\?v=[^"\']+', f'/assets/homepage.js?v={version}', text)
              text, css_count = re.subn(r'/assets/homepage-performance\.css\?v=[^"\']+', f'/assets/homepage-performance.css?v={version}', text)
              if js_count == 0:
                  raise SystemExit(f'Homepage JS asset reference not found in {name}')
              if css_count == 0:
                  raise SystemExit(f'Homepage CSS asset reference not found in {name}')
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/fix-service-price-previews-v5.yml').unlink()
          PY

      - name: Commit finished fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make service price previews visible and clickable'
          git push
