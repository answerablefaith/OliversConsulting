name: Make service tiers clickable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-service-tiers-clickable.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace price previews with clickable tier pills
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('assets/homepage.js')
          js = js_path.read_text(encoding='utf-8')

          start = js.find('  function initServicePricePreviews() {')
          end = js.find('  function boot() {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not find service price preview function')

          replacement = '''  function initServiceTierLinks() {
    const targets = {
      'Quick win': 'pricing-quick-win',
      'Core automation': 'pricing-core-automation',
      'Multi-system build': 'pricing-multi-system-build',
    };

    all('.oc-pricing-band').forEach((card) => {
      const name = text(card.querySelector('.oc-pricing-band-name'));
      const target = targets[name];
      if (!target) return;
      card.id = target;
      card.style.scrollMarginTop = '110px';
    });

    all('.oc-service-tier').forEach((tier) => {
      const name = text(tier);
      const target = targets[name];
      if (!target || tier.tagName === 'A') return;

      const link = document.createElement('a');
      link.className = tier.className;
      link.href = `#${target}`;
      link.textContent = name;
      link.setAttribute('aria-label', `${name} — view pricing`);
      tier.replaceWith(link);
    });
  }

'''

          js = js[:start] + replacement + js[end:]
          js = js.replace('    initServicePricePreviews();', '    initServiceTierLinks();')
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('assets/homepage-performance.css')
          css = css_path.read_text(encoding='utf-8')

          first_marker = css.find('/* Keep the service rows clean while allowing the visible price preview link to sit beside the tier. */')
          next_marker = css.find('/* The original animation changed `left`, forcing layout on every frame. */', first_marker)
          if first_marker != -1 and next_marker != -1:
              css = css[:first_marker] + '''/* Make the existing service tier pills the pricing links. */
.scp3 a.oc-service-tier {
  cursor: pointer;
  text-decoration: none !important;
  transition: border-color .16s, color .16s, background .16s, transform .16s;
}

.scp3 a.oc-service-tier:hover,
.scp3 a.oc-service-tier:focus-visible {
  border-color: #b5791f;
  color: #17130b;
  background: #efe4d1;
}

.scp3 a.oc-service-tier:focus-visible {
  outline: 2px solid #b5791f;
  outline-offset: 3px;
}

''' + css[next_marker:]

          # Remove any leftover mobile rules for the deleted price-preview UI.
          css = re.sub(r'\n\s*\.scp3 \.oc-service-tier-wrap \{[^}]*\}\n', '\n', css)
          css = re.sub(r'\n\s*\.scp3 \.oc-service-price-preview \{[^}]*\}\n', '\n', css)
          css_path.write_text(css, encoding='utf-8')

          version = '20260818-tier-links-v6'
          for name in ('index.html', 'scripts/optimize-homepage.mjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text, js_count = re.subn(r'/assets/homepage\.js\?v=[^"\']+', f'/assets/homepage.js?v={version}', text)
              text, css_count = re.subn(r'/assets/homepage-performance\.css\?v=[^"\']+', f'/assets/homepage-performance.css?v={version}', text)
              if js_count == 0:
                  raise SystemExit(f'Homepage JS reference not found in {name}')
              if css_count == 0:
                  raise SystemExit(f'Homepage CSS reference not found in {name}')
              path.write_text(text, encoding='utf-8')

          Path('.github/workflows/make-service-tiers-clickable.yml').unlink()
          PY

      - name: Commit finished change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make service tier pills link to pricing'
          git push
