name: Apply price preview fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-price-preview-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Force the updated homepage behaviour to load
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '/assets/homepage.js?v=20260818-smooth-hours'
          new = '/assets/homepage.js?v=20260818-price-previews-v2'

          for name in ('index.html', 'scripts/optimize-homepage.mjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cache key not found in {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          js = Path('assets/homepage.js').read_text(encoding='utf-8')
          required = ('initServicePricePreviews', 'From £395', 'From £1,495', 'From £2,995')
          missing = [item for item in required if item not in js]
          if missing:
              raise SystemExit(f'Price preview code is incomplete: {missing}')

          Path('.github/workflows/apply-price-preview-fix.yml').unlink()
          PY

      - name: Commit cache-bust and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Force Safari to load service price previews'
          git push
