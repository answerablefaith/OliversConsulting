name: Build static homepage preview

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-static-preview.mjs'
      - 'scripts/test-static-preview.mjs'
      - 'static-preview/behavior.js'
      - '.github/workflows/build-static-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply service-row pricing fix
        run: |
          git show HEAD^:.github/workflows/build-static-preview.yml > /tmp/original-build-static-preview.yml
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/homepage.js')
          js = js_path.read_text(encoding='utf-8')

          start = js.find('  function initServicePricePreviews() {')
          end = js.find('  function boot() {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not find existing service price preview function')

          replacement = '''  function initServicePricingLinks() {
    const pricing = document.querySelector('.oc-pricing-bands');
    if (!pricing) return;

    pricing.id = 'pricing-options';
    pricing.style.scrollMarginTop = '110px';

    if (!document.getElementById('oc-service-pricing-link-style')) {
      const style = document.createElement('style');
      style.id = 'oc-service-pricing-link-style';
      style.textContent = `
        .oc-service-pricing-link{cursor:pointer}
        .oc-service-pricing-link:hover{background:rgba(181,121,31,.055)}
        .oc-service-pricing-link:focus-visible{outline:2px solid #b5791f;outline-offset:3px;background:rgba(181,121,31,.055)}
        @media(max-width:900px){.oc-service-pricing-link{touch-action:manipulation}}
      `;
      document.head.appendChild(style);
    }

    all('.scp3').forEach((row) => {
      if (row.dataset.ocPricingLinkBound) return;
      row.dataset.ocPricingLinkBound = '1';
      row.classList.add('oc-service-pricing-link');
      row.setAttribute('role', 'link');
      row.setAttribute('tabindex', '0');

      const offering = text(row.querySelector('.sc-interp')) || 'Service';
      row.setAttribute('aria-label', `${offering} — view pricing options`);

      const goToPricing = () => {
        pricing.scrollIntoView({
          behavior: reduceMotion ? 'auto' : 'smooth',
          block: 'start',
        });
      };

      row.addEventListener('click', goToPricing);
      row.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        goToPricing();
      });
    });
  }

'''

          js = js[:start] + replacement + js[end:]
          js = js.replace('    initServicePricePreviews();', '    initServicePricingLinks();')
          js_path.write_text(js, encoding='utf-8')

          old = '/assets/homepage.js?v=20260818-price-previews-v2'
          new = '/assets/homepage.js?v=20260818-service-row-pricing-v3'
          for name in ('index.html', 'scripts/optimize-homepage.mjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cache key not found in {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          temp = Path('.github/workflows/make-service-rows-clickable.yml')
          if temp.exists():
              temp.unlink()
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/oc-static-preview-server.log 2>&1 &
          echo $! > /tmp/oc-static-preview-server.pid
          sleep 2

      - name: Capture rendered homepage
        run: node scripts/capture-static-preview.mjs

      - name: Verify loader and competing runtimes were removed
        run: |
          test -s static-preview/index.html
          grep -q 'data-oc-static-snapshot="true"' static-preview/index.html
          grep -q '/static-preview/behavior.js' static-preview/index.html
          ! grep -q '/static-preview/intro-animation.js' static-preview/index.html
          ! grep -q "fetch('/?oc-parity-source=1'" static-preview/index.html
          ! grep -q 'Loading the 1:1 homepage preview' static-preview/index.html
          ! grep -q 'class Component extends DCLogic' static-preview/index.html

      - name: Test static interactions and animations
        run: node scripts/test-static-preview.mjs

      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-preview/index.html
          if git diff --cached --quiet; then
            echo 'Static preview already up to date.'
          else
            git commit -m 'Generate standalone static homepage preview'
            git push
          fi

      - name: Commit service-row pricing fix and restore workflow
        run: |
          cp /tmp/original-build-static-preview.yml .github/workflows/build-static-preview.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No service-row pricing changes to commit.'
          else
            git commit -m 'Make entire service rows open pricing options'
            git push
          fi
