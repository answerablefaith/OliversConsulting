name: Build static homepage preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/oc-static-preview-server.log 2>&1 &
          echo $! > /tmp/oc-static-preview-server.pid
          sleep 2

      - name: Capture rendered homepage
        run: node scripts/capture-static-preview.mjs

      - name: Verify loader and competing runtimes were removed
        run: |
          test -s static-preview/index.html
          grep -q 'data-oc-static-snapshot="true"' static-preview/index.html
          grep -q '/static-preview/behavior.js' static-preview/index.html
          ! grep -q '/static-preview/intro-animation.js' static-preview/index.html
          ! grep -q "fetch('/?oc-parity-source=1'" static-preview/index.html
          ! grep -q 'Loading the 1:1 homepage preview' static-preview/index.html
          ! grep -q 'class Component extends DCLogic' static-preview/index.html

      - name: Test static interactions and animations
        run: node scripts/test-static-preview.mjs

      - name: Confirm preview remains read-only
        run: |
          git diff -- static-preview/index.html || true
          echo 'Static preview is a manual parity tool only; this workflow never commits or pushes generated output.'
