name: Build noindex homepage parity test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 >/tmp/oc-homepage-server.log 2>&1 &
          sleep 2

      - name: Generate noindex parity page only
        run: node scripts/build-prerendered-test.mjs

      - name: Verify parity output cannot be indexed or promoted
        run: |
          test -s pre-rendered-test/index.html
          grep -q 'name="robots" content="noindex,nofollow"' pre-rendered-test/index.html
          grep -q 'id="oc-runtime-handoff"' pre-rendered-test/index.html
          ! grep -q 'data-oc-static-production="true"' pre-rendered-test/index.html
