name: Make service rows clickable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/make-service-rows-clickable.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace price labels with whole-row pricing links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('assets/homepage.js')
          js = js_path.read_text(encoding='utf-8')

          start = js.find('  function initServicePricePreviews() {')
          end = js.find('  function boot() {', start)
          if start == -1 or end == -1:
              raise SystemExit('Could not find existing service price preview function')

          replacement = '''  function initServicePricingLinks() {
    const pricing = document.querySelector('.oc-pricing-bands');
    if (!pricing) return;

    pricing.id = 'pricing-options';
    pricing.style.scrollMarginTop = '110px';

    if (!document.getElementById('oc-service-pricing-link-style')) {
      const style = document.createElement('style');
      style.id = 'oc-service-pricing-link-style';
      style.textContent = `
        .oc-service-pricing-link{cursor:pointer}
        .oc-service-pricing-link:hover{background:rgba(181,121,31,.055)}
        .oc-service-pricing-link:focus-visible{outline:2px solid #b5791f;outline-offset:3px;background:rgba(181,121,31,.055)}
        @media(max-width:900px){.oc-service-pricing-link{touch-action:manipulation}}
      `;
      document.head.appendChild(style);
    }

    all('.scp3').forEach((row) => {
      if (row.dataset.ocPricingLinkBound) return;
      row.dataset.ocPricingLinkBound = '1';
      row.classList.add('oc-service-pricing-link');
      row.setAttribute('role', 'link');
      row.setAttribute('tabindex', '0');

      const offering = text(row.querySelector('.sc-interp')) || 'Service';
      row.setAttribute('aria-label', `${offering} — view pricing options`);

      const goToPricing = () => {
        pricing.scrollIntoView({
          behavior: reduceMotion ? 'auto' : 'smooth',
          block: 'start',
        });
      };

      row.addEventListener('click', goToPricing);
      row.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        event.preventDefault();
        goToPricing();
      });
    });
  }

'''

          js = js[:start] + replacement + js[end:]
          js = js.replace('    initServicePricePreviews();', '    initServicePricingLinks();')

          if 'oc-service-price-preview' in js or "From £395', target" in js:
              raise SystemExit('Old visible price-preview code still remains')

          js_path.write_text(js, encoding='utf-8')

          old = '/assets/homepage.js?v=20260818-price-previews-v2'
          new = '/assets/homepage.js?v=20260818-service-row-pricing-v3'
          for name in ('index.html', 'scripts/optimize-homepage.mjs'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected cache key not found in {name}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('.github/workflows/make-service-rows-clickable.yml').unlink()
          PY

      - name: Commit finished change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Make entire service rows open pricing options'
          git push
